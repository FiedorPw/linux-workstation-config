[ids]
*

[main]
# Map Home key to PageUp
home = pageup
# Map End key to PageDown
end = pagedown
# Map PageUp key to Home
pageup = home
# Map PageDown key to End
pagedown = end

# Mac → ThinkPad layout:
# ctrl = ctrl (default, no change)
# left option (⌥) = Super
leftalt = leftmeta
# left command (⌘) = Alt
leftmeta = leftalt
# right command (⌘) = AltGr (for Polish characters)
rightmeta = rightalt
# right option (⌥) = PrintScreen
rightalt = print
# Mac F4 (Launchpad) → F19 (used by push-to-talk script, prevents GNOME overview)
search = f19
